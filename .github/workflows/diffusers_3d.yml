name: Diffusers 3D

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "packages/diffusers-3d/**"
      - ".github/workflows/diffusers_3d.yml"
  push:
    branches:
      - main
    paths:
      - "packages/diffusers-3d/**"
      - ".github/workflows/diffusers_3d.yml"

permissions:
  contents: read

# GPU, compiled-backend, research-license, and production-checkpoint quality
# verification is intentionally manual and documented in
# packages/diffusers-3d/docs/testing.md. GitHub CPU jobs are not evidence for it.
jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install quality dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e .
          python -m pip install -e "packages/diffusers-3d[test]" --no-deps
          python -m pip install accelerate opencv-python-headless "rembg[cpu]" build pytest ruff safetensors "transformers>=5.5.0"
      - name: Check project AI guides
        run: python utils/check_ai.py
      - name: Check formatting, imports, and strict marker collection
        run: |
          python -m ruff check packages/diffusers-3d/src packages/diffusers-3d/tests packages/diffusers-3d/tools
          python -m pytest packages/diffusers-3d/tests --collect-only -q

  core-cpu:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install CPU dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e .
          python -m pip install -e "packages/diffusers-3d[test]" --no-deps
          python -m pip install \
            accelerate opencv-python-headless "rembg[cpu]" pymeshlab peft pytest pytest-cov safetensors "transformers>=5.5.0"
      - name: Verify CPU import and all backend-independent tests
        run: |
          python -c "import diffusers_3d"
          python -m pytest packages/diffusers-3d/tests \
            -m "not portable and not accelerated and not reference_parity and not release"

  portable:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install portable backends
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e .
          python -m pip install -e "packages/diffusers-3d[portable,test]" --no-deps
          python -m pip install accelerate opencv-python-headless "rembg[cpu]" pymeshlab pytest pytest-cov safetensors scikit-image "transformers>=5.5.0" trimesh xatlas
      - name: Run portable backend tests
        run: python -m pytest packages/diffusers-3d/tests -m portable

  reference-parity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install package and real reference dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e .
          python -m pip install -e "packages/diffusers-3d[reference-test,test]" --no-deps
          # Upstream reference modules import these at module level.
          python -m pip install accelerate einops opencv-python-headless optree pytest pyyaml safetensors scikit-image \
            torchdiffeq omegaconf tensordict plyfile timm tqdm "transformers>=5.5.0" trimesh xatlas \
            "rembg[cpu]" fast-simplification pymeshlab peft
          # NATTEN ships only an sdist; without CUDA it builds its pure-Python Flex backend.
          python -m pip install --no-build-isolation natten==0.21.0
      - name: Fetch exact trusted reference revisions
        shell: bash
        run: |
          set -euo pipefail
          clone_exact() {
            local repository="$1"
            local revision="$2"
            local destination="$3"
            git init "$destination"
            git -C "$destination" remote add origin "$repository"
            git -C "$destination" fetch --depth=1 origin "$revision"
            git -C "$destination" checkout --detach FETCH_HEAD
          }
          clone_exact \
            https://github.com/microsoft/TRELLIS.git \
            442aa1e1afb9014e80681d3bf604e8d728a86ee7 \
            "$RUNNER_TEMP/TRELLIS"
          # The mesh-decoder parity test needs the FlexiCubes submodule at the revision the superproject pins.
          git -C "$RUNNER_TEMP/TRELLIS" submodule update --init --depth=1 trellis/representations/mesh/flexicubes
          clone_exact \
            https://github.com/microsoft/TRELLIS.2.git \
            75fbf0183001ed9876c8dbb35de6b68552ee08bd \
            "$RUNNER_TEMP/TRELLIS.2"
          clone_exact \
            https://github.com/VAST-AI-Research/TripoSG.git \
            fc5c40990181e2a756c4e0b1c2f4d6b5202faf8c \
            "$RUNNER_TEMP/TripoSG"
          clone_exact \
            https://github.com/facebookresearch/sam-3d-objects.git \
            f91db411c50efee93d8db7aeb323885650f6f722 \
            "$RUNNER_TEMP/sam-3d-objects"
          clone_exact \
            https://github.com/stepfun-ai/Step1X-3D.git \
            cb5ac944709c6c913109070c7b90c3447f57f3d4 \
            "$RUNNER_TEMP/Step1X-3D"
          clone_exact \
            https://github.com/TencentARC/Pixal3D.git \
            f7cf38429b0bd264f1995f0f8743a88b1c728b94 \
            "$RUNNER_TEMP/Pixal3D"
          clone_exact \
            https://github.com/valeoai/NAF.git \
            37f2dfc180f2de53d98bd601109c0da0dd6b0f43 \
            "$RUNNER_TEMP/NAF"
          clone_exact \
            https://github.com/Tencent-Hunyuan/Hunyuan3D-2.1.git \
            82920d643c0dc2f7bfd7255f45f62d386edfe60c \
            "$RUNNER_TEMP/Hunyuan3D-2.1"
          clone_exact \
            https://github.com/microsoft/MoGe.git \
            a8c37341bc0325ca99b9d57981cc3bb2bd3e255b \
            "$RUNNER_TEMP/MoGe-a8c3734"
          clone_exact \
            https://github.com/microsoft/MoGe.git \
            74fbce054ebed49800de42d0ad0e83495065719a \
            "$RUNNER_TEMP/MoGe"
          clone_exact \
            https://github.com/EasternJournalist/utils3d.git \
            3913c65d81e05e47b9f367250cf8c0f7462a0900 \
            "$RUNNER_TEMP/utils3d-3913c65"
          clone_exact \
            https://github.com/EasternJournalist/utils3d-moge.git \
            62f09d58509485564e24d5d9f6aac9ee9ebc0c37 \
            "$RUNNER_TEMP/utils3d-moge-62f09d5"
          clone_exact \
            https://github.com/facebookresearch/dinov2.git \
            7764ea0f912e53c92e82eb78a2a1631e92725fc8 \
            "$RUNNER_TEMP/dinov2"
          # TRELLIS's DINOv2 weight-identity test compares the torch.hub checkpoint upstream loads.
          mkdir -p "$RUNNER_TEMP/dinov2_weights"
          curl -fsSL -o "$RUNNER_TEMP/dinov2_weights/dinov2_vitl14_reg4_pretrain.pth" \
            https://dl.fbaipublicfiles.com/dinov2/dinov2_vitl14/dinov2_vitl14_reg4_pretrain.pth
          echo "36e4deffbaef061a2576705b0c36f93621e2ae20bf6274694821b0b492551b51  $RUNNER_TEMP/dinov2_weights/dinov2_vitl14_reg4_pretrain.pth" | sha256sum -c -
          clone_exact \
            https://github.com/speridlabs/idol-sdk.git \
            4702a7f00850e34b6e83a2170cc123c3e9570744 \
            "$RUNNER_TEMP/idol-sdk"
          clone_exact \
            https://github.com/VAST-AI-Research/TripoSplat.git \
            d8db9e018b413dd9c4a9fe22463781bf98e8e68d \
            "$RUNNER_TEMP/TripoSplat"
          clone_exact \
            https://github.com/VAST-AI-Research/TripoSR.git \
            107cefdc244c39106fa830359024f6a2f1c78871 \
            "$RUNNER_TEMP/TripoSR"
          clone_exact \
            https://github.com/tatsy/torchmcubes.git \
            3381600ddc3d2e4d74222f8495866be5fafbace4 \
            "$RUNNER_TEMP/torchmcubes"
          clone_exact \
            https://github.com/Tencent-Hunyuan/Hunyuan3D-Omni.git \
            4d47c0cc2bd0c4281963a7314ab330a5af36bfa8 \
            "$RUNNER_TEMP/Hunyuan3D-Omni"
          {
            echo "DIFFUSERS_3D_TRELLIS_REFERENCE_ROOT=$RUNNER_TEMP/TRELLIS"
            echo "DIFFUSERS_3D_TRELLIS2_REFERENCE_ROOT=$RUNNER_TEMP/TRELLIS.2"
            echo "DIFFUSERS_3D_TRIPOSG_REFERENCE_ROOT=$RUNNER_TEMP/TripoSG"
            echo "DIFFUSERS_3D_SAM3D_REFERENCE_ROOT=$RUNNER_TEMP/sam-3d-objects"
            echo "DIFFUSERS_3D_STEP1X3D_REFERENCE_ROOT=$RUNNER_TEMP/Step1X-3D"
            echo "DIFFUSERS_3D_PIXAL3D_REFERENCE_ROOT=$RUNNER_TEMP/Pixal3D"
            echo "DIFFUSERS_3D_NAF_REFERENCE_ROOT=$RUNNER_TEMP/NAF"
            echo "DIFFUSERS_3D_HUNYUAN3D_REFERENCE_ROOT=$RUNNER_TEMP/Hunyuan3D-2.1"
            echo "DIFFUSERS_3D_MOGE_REFERENCE_ROOT=$RUNNER_TEMP/MoGe-a8c3734"
            echo "DIFFUSERS_3D_MOGE2_REFERENCE_ROOT=$RUNNER_TEMP/MoGe"
            echo "DIFFUSERS_3D_UTILS3D_REFERENCE_ROOT=$RUNNER_TEMP/utils3d-3913c65"
            echo "DIFFUSERS_3D_UTILS3D_MOGE_REFERENCE_ROOT=$RUNNER_TEMP/utils3d-moge-62f09d5"
            echo "DIFFUSERS_3D_DINOV2_REFERENCE_ROOT=$RUNNER_TEMP/dinov2"
            echo "DIFFUSERS_3D_DINOV2_REFERENCE_WEIGHTS=$RUNNER_TEMP/dinov2_weights/dinov2_vitl14_reg4_pretrain.pth"
            echo "DIFFUSERS_3D_IDOL_REFERENCE_ROOT=$RUNNER_TEMP/idol-sdk"
            echo "DIFFUSERS_3D_TRIPOSPLAT_REFERENCE_ROOT=$RUNNER_TEMP/TripoSplat"
            echo "DIFFUSERS_3D_TRIPOSR_REFERENCE_ROOT=$RUNNER_TEMP/TripoSR"
            echo "DIFFUSERS_3D_TORCHMCUBES_REFERENCE_ROOT=$RUNNER_TEMP/torchmcubes"
            echo "DIFFUSERS_3D_HUNYUAN3D_OMNI_REFERENCE_ROOT=$RUNNER_TEMP/Hunyuan3D-Omni"
          } >> "$GITHUB_ENV"
      - name: Run required pinned-reference parity without skips
        env:
          DIFFUSERS_3D_REQUIRE_REFERENCE: "1"
        run: |
          python -m pytest packages/diffusers-3d/tests \
            -m "reference_parity and not real_weights" \
            --junitxml="$RUNNER_TEMP/reference-parity.xml"
          python - <<'PY'
          import os
          import xml.etree.ElementTree as ET

          root = ET.parse(os.path.join(os.environ["RUNNER_TEMP"], "reference-parity.xml")).getroot()
          cases = list(root.iter("testcase"))
          xfailed = [case for case in cases if any(child.get("type") == "pytest.xfail" for child in case.findall("skipped"))]
          skipped = [case for case in cases if case.find("skipped") is not None and case not in xfailed]
          broken = [case for case in cases if case.find("failure") is not None or case.find("error") is not None]
          assert len(cases) == 179, f"expected 179 reference-parity cases, collected {len(cases)}"
          # Strict xfails document known deviations on inputs upstream mishandles (see the background tests).
          assert len(xfailed) == 8, f"expected 8 documented deviations, got {len(xfailed)}"
          assert not skipped and not broken, (
              f"reference parity was not clean: skipped={[c.get('name') for c in skipped]}, "
              f"failed={[c.get('name') for c in broken]}"
          )
          PY

  release-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install release-test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e .
          python -m pip install -e "packages/diffusers-3d[test]" --no-deps
          python -m pip install accelerate opencv-python-headless "rembg[cpu]" build pytest safetensors "transformers>=5.5.0"
      - name: Check release metadata and distribution contents
        run: python -m pytest packages/diffusers-3d/tests -m release

  distribution-build-install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install build and local Diffusers dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e .
          python -m pip install accelerate build opencv-python-headless "rembg[cpu]" safetensors "transformers>=5.5.0"
      - name: Build and verify wheel and source distribution contents
        run: |
          python -m build --outdir packages/diffusers-3d/wheelhouse packages/diffusers-3d
          wheel="$(python -c 'from pathlib import Path; paths=list(Path("packages/diffusers-3d/wheelhouse").glob("*.whl")); assert len(paths) == 1; print(paths[0])')"
          sdist="$(python -c 'from pathlib import Path; paths=list(Path("packages/diffusers-3d/wheelhouse").glob("*.tar.gz")); assert len(paths) == 1; print(paths[0])')"
          python packages/diffusers-3d/tools/verify_wheel.py "$wheel"
          python packages/diffusers-3d/tools/verify_sdist.py "$sdist"
      - name: Install wheel and import outside the checkout
        run: |
          wheel="$(python -c 'from pathlib import Path; print(next(Path("packages/diffusers-3d/wheelhouse").glob("*.whl")))')"
          python -m pip install --no-deps --force-reinstall "$wheel"
          python -m pip check
          diffusers-3d-convert-hunyuan3d --help > /dev/null
          diffusers-3d-convert-hunyuan3d-paint --help > /dev/null
          diffusers-3d-convert-trellis --help > /dev/null
          diffusers-3d-convert-trellis2 --help > /dev/null
          diffusers-3d-convert-triposg --help > /dev/null
          diffusers-3d-convert-sam3d --help > /dev/null
          diffusers-3d-convert-step1x3d --help > /dev/null
          diffusers-3d-convert-step1x3d-texture --help > /dev/null
          diffusers-3d-convert-pixal3d --help > /dev/null
          diffusers-3d-convert-idol --help > /dev/null
          diffusers-3d-convert-triposplat --help > /dev/null
          diffusers-3d-convert-triposr --help > /dev/null
          diffusers-3d-convert-hunyuan3d-omni --help > /dev/null
          cd /tmp
          python -I -c "import diffusers_3d; print(diffusers_3d.__version__)"

  minimum-supported-stack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install local packages and exact minimum dependency stack
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e .
          python -m pip install -e "packages/diffusers-3d[test]" --no-deps
          python -m pip install \
            "accelerate==1.1.0" build huggingface-hub numpy opencv-python-headless Pillow "rembg[cpu]" \
            pytest pytest-cov ruff safetensors "transformers==5.5.0"
      - name: Verify declared local and minimum compatibility
        run: |
          python -c "import diffusers; assert diffusers.__version__.split('.')[:2] in (['0', '40'], ['0', '41']), diffusers.__version__"
          python -c "import accelerate; assert accelerate.__version__ == '1.1.0', accelerate.__version__"
          python -c "import transformers; assert transformers.__version__ == '5.5.0', transformers.__version__"
          python -m pip check
          python -m pytest \
            packages/diffusers-3d/tests/execution \
            packages/diffusers-3d/tests/data/test_image_processing.py \
            packages/diffusers-3d/tests/families/trellis/test_conditioner.py \
            packages/diffusers-3d/tests/families/trellis2/test_image_encoder.py \
            packages/diffusers-3d/tests/families/step1x3d/test_conditioner.py
