[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "diffusers-3d"
version = "0.1.0.dev0"
description = "Object-native 3D generation built on Diffusers"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0 AND MIT AND LicenseRef-SAM-License AND LicenseRef-Tencent-Hunyuan-3D-2.1-Community AND LicenseRef-Tencent-Hunyuan-3D-Omni-Community AND BSD-3-Clause"
license-files = [
    "LICENSE-APACHE-2.0",
    "src/diffusers_3d/families/trellis/LICENSE-MIT",
    "src/diffusers_3d/families/trellis/NOTICE",
    "src/diffusers_3d/families/trellis2/LICENSE-MIT",
    "src/diffusers_3d/families/trellis2/NOTICE",
    "src/diffusers_3d/families/triposg/LICENSE-MIT",
    "src/diffusers_3d/families/triposg/NOTICE",
    "src/diffusers_3d/families/sam3d_objects/LICENSE-SAM",
    "src/diffusers_3d/families/sam3d_objects/NOTICE",
    "src/diffusers_3d/families/step1x3d/LICENSE-APACHE-2.0",
    "src/diffusers_3d/families/step1x3d/LICENSE-MIT",
    "src/diffusers_3d/families/step1x3d/NOTICE",
    "src/diffusers_3d/families/pixal3d/LICENSE-MIT",
    "src/diffusers_3d/families/pixal3d/NOTICE",
    "src/diffusers_3d/families/hunyuan3d/LICENSE-TENCENT-HUNYUAN-3D-2.1",
    "src/diffusers_3d/families/hunyuan3d/NOTICE",
    "src/diffusers_3d/families/moge/LICENSE-BSD-3-CLAUSE-SCIPY",
    "src/diffusers_3d/families/moge/LICENSE-MIT",
    "src/diffusers_3d/families/moge/NOTICE",
    "src/diffusers_3d/families/idol/LICENSE-APACHE-2.0",
    "src/diffusers_3d/families/idol/NOTICE",
    "src/diffusers_3d/families/triposplat/LICENSE-MIT",
    "src/diffusers_3d/families/triposplat/NOTICE",
    "src/diffusers_3d/families/triposr/LICENSE-MIT",
    "src/diffusers_3d/families/triposr/NOTICE",
    "src/diffusers_3d/families/hunyuan3d_omni/LICENSE-TENCENT-HUNYUAN-3D-OMNI",
    "src/diffusers_3d/families/hunyuan3d_omni/NOTICE",
]
authors = [{ name = "The Diffusers 3D contributors" }]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "accelerate>=1.1.0",
    "diffusers>=0.40.0.dev0,<0.42",
    "huggingface-hub",
    "numpy",
    "opencv-python-headless",
    "Pillow",
    "rembg[cpu]",
    "scikit-image",
    "safetensors",
    "torch>=2.6",
    "torchvision",
    "transformers>=5.5.0",
]

[project.scripts]
diffusers-3d-convert-hunyuan3d = "diffusers_3d.families.hunyuan3d.conversion:main"
diffusers-3d-convert-hunyuan3d-paint = "diffusers_3d.families.hunyuan3d.paint_conversion:main"
diffusers-3d-convert-pixal3d = "diffusers_3d.families.pixal3d.conversion:main"
diffusers-3d-convert-sam3d = "diffusers_3d.families.sam3d_objects.conversion:main"
diffusers-3d-convert-step1x3d = "diffusers_3d.families.step1x3d.conversion:main"
diffusers-3d-convert-step1x3d-texture = "diffusers_3d.families.step1x3d.texture_conversion:main"
diffusers-3d-convert-trellis = "diffusers_3d.families.trellis.conversion:main"
diffusers-3d-convert-trellis2 = "diffusers_3d.families.trellis2.conversion:main"
diffusers-3d-convert-triposg = "diffusers_3d.families.triposg.conversion:main"
diffusers-3d-convert-moge = "diffusers_3d.families.moge.conversion:main"
diffusers-3d-convert-idol = "diffusers_3d.families.idol.conversion:main"
diffusers-3d-convert-triposplat = "diffusers_3d.families.triposplat.conversion:main"
diffusers-3d-convert-triposr = "diffusers_3d.families.triposr.conversion:main"
diffusers-3d-convert-hunyuan3d-omni = "diffusers_3d.families.hunyuan3d_omni.conversion:main"

[project.optional-dependencies]
portable = [
    "fast-simplification",
    "scikit-image",
    "trimesh",
    "xatlas",
]
meshlab = ["pymeshlab"]
gaussian = ["gsplat"]
lora = ["peft>=0.17.0"]
reference-test = [
    "plyfile",
    "tensordict",
    "torchvision",
    "omegaconf",
    "torchdiffeq",
    "einops",
    "optree",
    "scikit-image",
    "timm",
    "natten==0.21.0",
    "xatlas",
]
test = [
    "build",
    "pytest",
    "pytest-cov",
    "ruff",
]

[project.urls]
Repository = "https://github.com/suvadityamuk/diffusers-3d"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
diffusers_3d = [
    "py.typed",
    "families/hunyuan3d/*.md",
    "families/hunyuan3d/LICENSE*",
    "families/hunyuan3d/NOTICE",
    "families/pixal3d/*.md",
    "families/pixal3d/LICENSE*",
    "families/pixal3d/NOTICE",
    "families/sam3d_objects/*.md",
    "families/sam3d_objects/LICENSE*",
    "families/sam3d_objects/NOTICE",
    "families/step1x3d/*.md",
    "families/step1x3d/LICENSE*",
    "families/step1x3d/NOTICE",
    "families/trellis/*.md",
    "families/trellis/LICENSE*",
    "families/trellis/NOTICE",
    "families/trellis2/*.md",
    "families/trellis2/LICENSE*",
    "families/trellis2/NOTICE",
    "families/triposg/*.md",
    "families/triposg/LICENSE*",
    "families/triposg/NOTICE",
    "families/moge/*.md",
    "families/moge/LICENSE*",
    "families/moge/NOTICE",
    "families/idol/*.md",
    "families/idol/LICENSE*",
    "families/idol/NOTICE",
    "families/triposplat/*.md",
    "families/triposplat/LICENSE*",
    "families/triposplat/NOTICE",
    "families/triposr/*.md",
    "families/triposr/LICENSE*",
    "families/triposr/NOTICE",
    "families/hunyuan3d_omni/*.md",
    "families/hunyuan3d_omni/LICENSE*",
    "families/hunyuan3d_omni/NOTICE",
]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
markers = [
    "portable: requires the optional portable geometry backends",
    "accelerated: requires an actual GPU or compiled accelerated backend",
    "reference_parity: compares against a pinned upstream reference checkout",
    "integration: exercises multiple package subsystems together",
    "release: verifies release metadata or built distribution contents",
    "real_weights: downloads released checkpoints; opt in with its environment variable",
]
testpaths = ["tests"]

[tool.ruff]
line-length = 119
src = ["src", "tests"]

[tool.ruff.lint]
ignore = ["C901", "E501"]
select = ["C", "E", "F", "I", "W"]

[tool.ruff.format]
quote-style = "double"
